# Blender MCP unified Docker test stack.
# Suites are separate services sharing one image so a clean build is reusable.
# The runner script (scripts/run_blender_mcp_docker_tests.py) drives these.
#
# Paths are relative to this compose file (the repo root).

services:
  test-unit:
    build:
      context: .
      dockerfile: docker/mcp-test.Dockerfile
    image: blender-mcp-test:latest
    command: ["bash", "-lc", "mkdir -p /artifacts/unit && python3 -m pytest tools/blender_mcp/tests/test_protocol_v1.py tools/blender_mcp/tests/test_phase2_schemas.py tools/blender_mcp/tests/test_phase2_handlers.py tools/blender_mcp/tests/test_phase4_transactions.py tools/blender_mcp/tests/test_phase5_pbr_asset.py tools/blender_mcp/tests/test_vision_contract.py tools/blender_mcp/tests/test_p0.py tools/blender_mcp/tests/test_exports.py -v --timeout=120 --junitxml=/artifacts/unit/junit.xml"]
    volumes:
      - ./artifacts/docker-tests:/artifacts
    environment:
      - BLENDER_MCP_TEST_NO_BPY=1

  test-blender-integration:
    image: blender-mcp-test:latest
    build:
      context: .
      dockerfile: docker/mcp-test.Dockerfile
    command: ["bash", "-lc", "mkdir -p /artifacts/blender-integration && blender --factory-startup --background --python tools/blender_mcp/tests/e2e/test_read_mode_e2e.py > /artifacts/blender-integration/read_mode.log 2>&1 || exit 1 && blender --factory-startup --background --python tools/blender_mcp/tests/e2e/test_scene_export_e2e.py > /artifacts/blender-integration/scene_export.log 2>&1 || exit 1"]
    volumes:
      - ./artifacts/docker-tests:/artifacts
    environment:
      - PYTHONPATH=/opt/blender_mcp/tools/blender_mcp:/opt/blender_mcp/tools:/opt/blender_mcp/tools/blender_graph_tracker

  test-e2e:
    image: blender-mcp-test:latest
    command: ["bash", "-lc", "mkdir -p /artifacts/e2e && python3 -m pytest tools/blender_mcp/tests/test_protocol_v1_server.py -v --timeout=120 --junitxml=/artifacts/e2e/junit.xml || echo 'e2e suite pending phase 1 implementation'"]
    volumes:
      - ./artifacts/docker-tests:/artifacts
    environment:
      - PYTHONPATH=/opt/blender_mcp/tools/blender_mcp:/opt/blender_mcp/tools:/opt/blender_mcp/tools/blender_graph_tracker

  test-render:
    image: blender-mcp-test:latest
    command: ["bash", "-lc", "echo 'render worker suite pending phase 6'"]
    volumes:
      - ./artifacts/docker-tests:/artifacts

  test-vision:
    image: blender-mcp-test:latest
    command: ["bash", "-lc", "mkdir -p /artifacts/vision && python3 -m pytest tools/blender_mcp/tests/test_vision_contract.py -v --timeout=60 --junitxml=/artifacts/vision/junit.xml"]
    volumes:
      - ./artifacts/docker-tests:/artifacts
    environment:
      - BLENDER_MCP_VISION_MODE=sidecar
      - BLENDER_MCP_VISION_PROVIDER=fake

  test-asset:
    image: blender-mcp-test:latest
    command: ["bash", "-lc", "echo 'asset suite pending phase 5'"]
    volumes:
      - ./artifacts/docker-tests:/artifacts

  test-failure:
    image: blender-mcp-test:latest
    command: ["bash", "-lc", "python3 -m pytest tools/blender_mcp/tests/test_failure_injection.py -v --junitxml=/artifacts/failure/junit.xml || echo 'failure suite pending phase 1'"]
    volumes:
      - ./artifacts/docker-tests:/artifacts

  test-acceptance:
    image: blender-mcp-test:latest
    command: ["bash", "-lc", "echo 'acceptance scenarios pending later phases'"]
    volumes:
      - ./artifacts/docker-tests:/artifacts

  test-soak:
    image: blender-mcp-test:latest
    command: ["bash", "-lc", "echo 'soak suite pending later phases'"]
    volumes:
      - ./artifacts/docker-tests:/artifacts

  # Optional GPU profile. Not required for the mandatory suite.
  # Enable with: python scripts/run_blender_mcp_docker_tests.py --suite gpu
  # Requires NVIDIA Container Toolkit on the host.
  test-gpu:
    image: blender-mcp-test:latest
    command: ["bash", "-lc", "echo 'optional GPU suite: requires NVIDIA Container Toolkit'"]
    volumes:
      - ./artifacts/docker-tests:/artifacts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["gpu"]
